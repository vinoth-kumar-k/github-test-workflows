# Environment-specific configuration for GitHub Actions workflows
# This file contains parameterized settings for different deployment environments

dev:
  key-vault-name: kv-dev
  dotnet-core:
    acr-name: akssandboxacr.azurecr.io
    aks-cluster: aks-sandbox-cluster
    resource-group: rg-vinoth
    namespace: dev
    image-tag-suffix: dev
  vbnet:
    vm-name: vm-vbnet-dev
    resource-group: rg-vinoth
    storage-account: stvbnetdeploy    # Storage account for deployment staging
    storage-container: deployments
    iis-site: Default Web Site
    iis-app-name: VBNetApp-Dev
    iis-app-pool: VBNetAppPool-Dev

staging:
  key-vault-name: kv-staging
  dotnet-core:
    acr-name: myacrstaging           # placeholder
    aks-cluster: aks-staging          # placeholder
    resource-group: rg-staging        # placeholder
    namespace: staging
    image-tag-suffix: staging
  vbnet:
    vm-name: vm-staging
    resource-group: rg-staging
    iis-site: Default Web Site
    iis-app-name: VBNetApp-Staging
    iis-app-pool: VBNetAppPool-Staging

prod:
  key-vault-name: kv-prod
  dotnet-core:
    acr-name: myacrprod              # placeholder
    aks-cluster: aks-prod            # placeholder
    resource-group: rg-prod          # placeholder
    namespace: production
    image-tag-suffix: latest
  vbnet:
    vm-name: vm-prod
    resource-group: rg-prod
    iis-site: Default Web Site
    iis-app-name: VBNetApp
    iis-app-pool: VBNetAppPool
