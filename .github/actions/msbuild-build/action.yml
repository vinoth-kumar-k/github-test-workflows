name: 'Build with MSBuild'
description: 'Builds .NET Framework applications using MSBuild (for VB.NET and C# legacy apps)'
author: 'Architecture Team'

inputs:
  solution-path:
    description: 'Path to solution or project file'
    required: true
  configuration:
    description: 'Build configuration (Debug/Release)'
    required: false
    default: 'Release'
  platform:
    description: 'Build platform (Any CPU, x86, x64)'
    required: false
    default: 'Any CPU'
  restore-nuget:
    description: 'Restore NuGet packages before build'
    required: false
    default: 'true'
  create-package:
    description: 'Create deployment package (clean flat ZIP)'
    required: false
    default: 'true'

outputs:
  build-output:
    description: 'Path to build output'
    value: ${{ steps.build.outputs.build-output }}
  package-path:
    description: 'Path to deployment package'
    value: ${{ steps.package.outputs.package-path }}

runs:
  using: "composite"
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Cache NuGet packages
      if: inputs.restore-nuget == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.config', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet packages
      if: inputs.restore-nuget == 'true'
      shell: pwsh
      env:
        SOLUTION_PATH: ${{ inputs.solution-path }}
      run: nuget restore "$env:SOLUTION_PATH"

    - name: Build with MSBuild
      id: build
      shell: pwsh
      env:
        SOLUTION_PATH: ${{ inputs.solution-path }}
        CONFIGURATION: ${{ inputs.configuration }}
        PLATFORM: ${{ inputs.platform }}
        CREATE_PACKAGE: ${{ inputs.create-package }}
      run: |
        # Build arguments
        $buildArgs = @(
          $env:SOLUTION_PATH,
          "/p:Configuration=$($env:CONFIGURATION)",
          "/p:Platform=$($env:PLATFORM)",
          "/maxcpucount",
          "/verbosity:minimal"
        )

        # Build MSDeploy package — WebPublishMethod=FileSystem is ignored by
        # legacy ASP.NET Web Application projects, so we use Package mode and
        # extract the flat content from the MSDeploy ZIP in the next step.
        if ($env:CREATE_PACKAGE -eq "true") {
          $packageLocation = Join-Path (Get-Location) "publish"
          $buildArgs += @(
            "/p:DeployOnBuild=true",
            "/p:WebPublishMethod=Package",
            "/p:PackageAsSingleFile=true",
            "/p:SkipInvalidConfigurations=true",
            "/p:PackageLocation=$packageLocation"
          )
        }

        # Execute MSBuild
        Write-Host "Building with MSBuild..."
        Write-Host "Arguments: $buildArgs"

        msbuild @buildArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Error "MSBuild failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        # Set outputs
        $solutionDir = Split-Path -Parent $env:SOLUTION_PATH
        echo "build-output=$solutionDir\bin\$($env:CONFIGURATION)" >> $env:GITHUB_OUTPUT

    - name: Repackage as clean flat ZIP
      id: package
      if: inputs.create-package == 'true'
      shell: pwsh
      run: |
        $publishDir = Join-Path (Get-Location) "publish"

        # Find the MSDeploy ZIP produced by MSBuild
        $msdeployZip = Get-ChildItem -Path $publishDir -Filter "*.zip" -File -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if (-not $msdeployZip) {
          # Fallback: search under the solution's obj folder
          $msdeployZip = Get-ChildItem -Path "src" -Filter "*.zip" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match 'Package' } | Select-Object -First 1
        }

        if (-not $msdeployZip) {
          Write-Error "No MSDeploy package ZIP found"
          exit 1
        }

        Write-Host "Found MSDeploy package: $($msdeployZip.FullName)"

        # Extract MSDeploy ZIP to temp folder
        $extractTemp = Join-Path $publishDir "extract-temp"
        Expand-Archive -Path $msdeployZip.FullName -DestinationPath $extractTemp -Force

        # MSDeploy packages nest content under PackageTmp — find web.config to locate the web root
        $webConfig = Get-ChildItem -Path $extractTemp -Filter "web.config" -Recurse -File | Select-Object -First 1

        if ($webConfig) {
          $contentDir = $webConfig.DirectoryName
          Write-Host "Found web content at: $contentDir"
        } else {
          Write-Error "No web.config found inside MSDeploy package"
          exit 1
        }

        # Create clean flat ZIP from the web content
        $cleanZipPath = Join-Path $publishDir "VBNetApp.zip"
        # Remove the original MSDeploy ZIP first if it has the same name
        if ($msdeployZip.FullName -eq $cleanZipPath) {
          $msdeployZip = $null  # release handle
          Remove-Item -Path $cleanZipPath -Force
        }
        Compress-Archive -Path "$contentDir\*" -DestinationPath $cleanZipPath -Force

        # Cleanup temp
        Remove-Item -Path $extractTemp -Recurse -Force -ErrorAction SilentlyContinue

        $zipSize = [math]::Round((Get-Item $cleanZipPath).Length / 1MB, 2)
        Write-Host "Clean deployment package created: $cleanZipPath ($zipSize MB)"

        # Verify ZIP contains flat IIS-ready structure
        Write-Host "ZIP contents (top-level):"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($cleanZipPath)
        $zip.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique |
          ForEach-Object { Write-Host "  $_" }
        $zip.Dispose()

        echo "package-path=$cleanZipPath" >> $env:GITHUB_OUTPUT

    - name: Upload build artifacts
      if: inputs.create-package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: publish/VBNetApp.zip
        retention-days: 30
