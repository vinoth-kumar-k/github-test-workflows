name: 'Build with MSBuild'
description: 'Builds .NET Framework applications using MSBuild (for VB.NET and C# legacy apps)'
author: 'Architecture Team'

inputs:
  solution-path:
    description: 'Path to solution or project file'
    required: true
  configuration:
    description: 'Build configuration (Debug/Release)'
    required: false
    default: 'Release'
  platform:
    description: 'Build platform (Any CPU, x86, x64)'
    required: false
    default: 'Any CPU'
  restore-nuget:
    description: 'Restore NuGet packages before build'
    required: false
    default: 'true'
  create-package:
    description: 'Create deployment package (clean flat ZIP)'
    required: false
    default: 'true'

outputs:
  build-output:
    description: 'Path to build output'
    value: ${{ steps.build.outputs.build-output }}
  package-path:
    description: 'Path to deployment package'
    value: ${{ steps.package.outputs.package-path }}

runs:
  using: "composite"
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Cache NuGet packages
      if: inputs.restore-nuget == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.config', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet packages
      if: inputs.restore-nuget == 'true'
      shell: pwsh
      env:
        SOLUTION_PATH: ${{ inputs.solution-path }}
      run: nuget restore "$env:SOLUTION_PATH"

    - name: Build with MSBuild
      id: build
      shell: pwsh
      env:
        SOLUTION_PATH: ${{ inputs.solution-path }}
        CONFIGURATION: ${{ inputs.configuration }}
        PLATFORM: ${{ inputs.platform }}
        CREATE_PACKAGE: ${{ inputs.create-package }}
      run: |
        # Build arguments
        $buildArgs = @(
          $env:SOLUTION_PATH,
          "/p:Configuration=$($env:CONFIGURATION)",
          "/p:Platform=$($env:PLATFORM)",
          "/maxcpucount",
          "/verbosity:minimal"
        )

        # Publish to a flat folder structure for clean IIS deployment
        if ($env:CREATE_PACKAGE -eq "true") {
          $publishUrl = Join-Path (Get-Location) "publish\content"
          $buildArgs += @(
            "/p:DeployOnBuild=true",
            "/p:WebPublishMethod=FileSystem",
            "/p:publishUrl=$publishUrl",
            "/p:SkipInvalidConfigurations=true"
          )
        }

        # Execute MSBuild
        Write-Host "Building with MSBuild..."
        Write-Host "Arguments: $buildArgs"

        msbuild @buildArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Error "MSBuild failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        # Set outputs
        $solutionDir = Split-Path -Parent $env:SOLUTION_PATH
        echo "build-output=$solutionDir\bin\$($env:CONFIGURATION)" >> $env:GITHUB_OUTPUT

    - name: Create deployment ZIP
      id: package
      if: inputs.create-package == 'true'
      shell: pwsh
      run: |
        $contentDir = Join-Path (Get-Location) "publish\content"
        $zipPath = Join-Path (Get-Location) "publish\VBNetApp.zip"

        if (-not (Test-Path $contentDir)) {
          Write-Error "Publish content directory not found: $contentDir"
          exit 1
        }

        Write-Host "Creating clean deployment ZIP from: $contentDir"
        Compress-Archive -Path "$contentDir\*" -DestinationPath $zipPath -Force

        $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
        Write-Host "Deployment package created: $zipPath ($zipSize MB)"

        # Verify ZIP contains flat IIS-ready structure
        Write-Host "ZIP contents (top-level):"
        $entries = [System.IO.Compression.ZipFile]::OpenRead($zipPath).Entries |
          ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique
        $entries | ForEach-Object { Write-Host "  $_" }

        echo "package-path=$zipPath" >> $env:GITHUB_OUTPUT

    - name: Upload build artifacts
      if: inputs.create-package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: publish/VBNetApp.zip
        retention-days: 30
