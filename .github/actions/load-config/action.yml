name: 'Load Environment Configuration'
description: 'Parses environments.yml and outputs environment-specific configuration values'
author: 'Architecture Team'

inputs:
  environment:
    description: 'Target environment (dev/staging/prod)'
    required: true
  app-type:
    description: 'Application type section to read (dotnet-core/vbnet)'
    required: true
  config-path:
    description: 'Path to environments.yml config file'
    required: false
    default: '.github/config/environments.yml'

outputs:
  # Environment-level
  key-vault-name:
    description: 'Azure Key Vault name for the environment'
    value: ${{ steps.parse.outputs.key-vault-name }}
  # VB.NET specific
  vm-name:
    description: 'Azure VM name'
    value: ${{ steps.parse.outputs.vm-name }}
  resource-group:
    description: 'Azure resource group'
    value: ${{ steps.parse.outputs.resource-group }}
  iis-site:
    description: 'IIS site name'
    value: ${{ steps.parse.outputs.iis-site }}
  iis-app-name:
    description: 'IIS application name'
    value: ${{ steps.parse.outputs.iis-app-name }}
  iis-app-pool:
    description: 'IIS application pool name'
    value: ${{ steps.parse.outputs.iis-app-pool }}
  storage-account:
    description: 'Azure storage account for deployment staging'
    value: ${{ steps.parse.outputs.storage-account }}
  storage-container:
    description: 'Azure storage container for deployment packages'
    value: ${{ steps.parse.outputs.storage-container }}
  # .NET Core specific
  acr-name:
    description: 'Azure Container Registry name'
    value: ${{ steps.parse.outputs.acr-name }}
  aks-cluster:
    description: 'AKS cluster name'
    value: ${{ steps.parse.outputs.aks-cluster }}
  namespace:
    description: 'Kubernetes namespace'
    value: ${{ steps.parse.outputs.namespace }}
  image-tag-suffix:
    description: 'Docker image tag suffix'
    value: ${{ steps.parse.outputs.image-tag-suffix }}

runs:
  using: "composite"
  steps:
    - name: Parse environment configuration
      id: parse
      shell: pwsh
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        TARGET_ENV: ${{ inputs.environment }}
        APP_TYPE: ${{ inputs.app-type }}
      run: |
        # Simple YAML parser for the flat environments.yml structure.
        # Supports two levels: environment-level keys and app-type section keys.
        $lines = Get-Content -Path $env:CONFIG_PATH

        $currentEnv = $null
        $currentSection = $null
        $config = @{}

        foreach ($line in $lines) {
            # Skip empty lines and comments
            if ($line -match '^\s*$' -or $line -match '^\s*#') { continue }

            # Strip inline comments (but preserve values containing #)
            $stripped = $line -replace '\s+#[^''\"]*$', ''

            # Determine indent level (number of leading spaces)
            $indent = ($stripped -replace '[^ ].*', '').Length

            if ($indent -eq 0 -and $stripped -match '^(\S+):\s*$') {
                # Top-level key = environment name
                $currentEnv = $Matches[1]
                $currentSection = $null
                $config[$currentEnv] = @{ '_sections' = @{} }
            }
            elseif ($indent -eq 2 -and $currentEnv) {
                if ($stripped -match '^\s+(\S+):\s*$') {
                    # Section header (app-type like dotnet-core, vbnet)
                    $currentSection = $Matches[1]
                    $config[$currentEnv]['_sections'][$currentSection] = @{}
                }
                elseif ($stripped -match '^\s+(\S+):\s+(.+)') {
                    # Environment-level key-value pair
                    $config[$currentEnv][$Matches[1]] = $Matches[2].Trim()
                    $currentSection = $null
                }
            }
            elseif ($indent -eq 4 -and $currentEnv -and $currentSection) {
                if ($stripped -match '^\s+(\S+):\s+(.+)') {
                    # Section-level key-value pair
                    $config[$currentEnv]['_sections'][$currentSection][$Matches[1]] = $Matches[2].Trim()
                }
            }
        }

        # Validate environment exists
        if (-not $config.ContainsKey($env:TARGET_ENV)) {
            $available = ($config.Keys | Where-Object { $_ -ne '_sections' }) -join ', '
            Write-Error "Environment '$($env:TARGET_ENV)' not found in $($env:CONFIG_PATH). Available: $available"
            exit 1
        }

        $envConfig = $config[$env:TARGET_ENV]

        # Validate app-type exists
        if (-not $envConfig['_sections'].ContainsKey($env:APP_TYPE)) {
            $available = ($envConfig['_sections'].Keys) -join ', '
            Write-Error "App type '$($env:APP_TYPE)' not found under '$($env:TARGET_ENV)'. Available: $available"
            exit 1
        }

        $appConfig = $envConfig['_sections'][$env:APP_TYPE]

        # Write environment-level values
        foreach ($key in $envConfig.Keys) {
            if ($key -eq '_sections') { continue }
            Write-Host "  $key=$($envConfig[$key])"
            echo "$key=$($envConfig[$key])" >> $env:GITHUB_OUTPUT
        }

        # Write app-type-specific values
        foreach ($key in $appConfig.Keys) {
            Write-Host "  $key=$($appConfig[$key])"
            echo "$key=$($appConfig[$key])" >> $env:GITHUB_OUTPUT
        }

        Write-Host "Loaded configuration for $($env:TARGET_ENV)/$($env:APP_TYPE)"
