name: 'Deploy to IIS via Azure VM'
description: 'Deploys application to IIS on Azure VMs via Azure Blob Storage staging and VM Run Command'
author: 'Architecture Team'

inputs:
  vm-name:
    description: 'Azure VM name'
    required: true
  resource-group:
    description: 'Azure resource group name'
    required: true
  storage-account:
    description: 'Azure Storage account for deployment staging'
    required: true
  storage-container:
    description: 'Azure Storage container name'
    required: true
  package-path:
    description: 'Path to the deployment package (ZIP file)'
    required: true
  deploy-script-path:
    description: 'Path to the deployment PowerShell script on the VM'
    required: false
    default: 'src/VBNetApp/deployment/deploy.ps1'
  iis-site-name:
    description: 'IIS site name'
    required: false
    default: 'Default Web Site'
  iis-app-name:
    description: 'IIS application name'
    required: true
  iis-app-pool:
    description: 'IIS application pool name'
    required: true
  environment:
    description: 'Deployment environment (dev/staging/prod)'
    required: false
    default: 'dev'

outputs:
  deployment-status:
    description: 'Deployment status (success/failure)'
    value: ${{ steps.deploy.outputs.status }}
  app-url:
    description: 'Application URL'
    value: ${{ steps.vm-check.outputs.app-url }}

runs:
  using: "composite"
  steps:
    - name: Verify VM is running
      id: vm-check
      shell: pwsh
      env:
        VM_NAME: ${{ inputs.vm-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        IIS_APP_NAME: ${{ inputs.iis-app-name }}
      run: |
        Write-Host "Checking VM status..."

        $vmInfo = az vm show -d `
          -g $env:RESOURCE_GROUP `
          -n $env:VM_NAME `
          --query "{powerState:powerState, publicIp:publicIps}" `
          -o json | ConvertFrom-Json

        Write-Host "VM: $($env:VM_NAME)"
        Write-Host "Power State: $($vmInfo.powerState)"
        Write-Host "Public IP: $($vmInfo.publicIp)"

        if ($vmInfo.powerState -ne "VM running") {
          Write-Error "VM is not running! Current state: $($vmInfo.powerState)"
          exit 1
        }

        $appUrl = "http://$($vmInfo.publicIp)/$($env:IIS_APP_NAME)"
        echo "public-ip=$($vmInfo.publicIp)" >> $env:GITHUB_OUTPUT
        echo "app-url=$appUrl" >> $env:GITHUB_OUTPUT

    - name: Upload package to blob storage
      id: upload-blob
      shell: pwsh
      env:
        STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        STORAGE_CONTAINER: ${{ inputs.storage-container }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
      run: |
        Write-Host "Uploading deployment package to Azure Blob Storage..."
        Write-Host "Storage Account: $($env:STORAGE_ACCOUNT)"
        Write-Host "Container: $($env:STORAGE_CONTAINER)"

        # Get storage account key
        $accountKey = az storage account keys list `
          --resource-group $env:RESOURCE_GROUP `
          --account-name $env:STORAGE_ACCOUNT `
          --query "[0].value" `
          --output tsv

        if (-not $accountKey) {
          Write-Error "Failed to get storage account key"
          exit 1
        }
        Write-Host "Retrieved storage account key"

        # Generate unique blob name
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $blobName = "vbnetapp-$timestamp.zip"

        # Create container if it doesn't exist
        az storage container create `
          --account-name $env:STORAGE_ACCOUNT `
          --account-key $accountKey `
          --name $env:STORAGE_CONTAINER `
          --only-show-errors 2>&1 | Out-Null

        # Upload the package
        Write-Host "Uploading package as: $blobName"
        $uploadResult = az storage blob upload `
          --account-name $env:STORAGE_ACCOUNT `
          --account-key $accountKey `
          --container-name $env:STORAGE_CONTAINER `
          --name $blobName `
          --file $env:PACKAGE_PATH `
          --overwrite `
          --output json 2>&1

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to upload package to blob storage: $uploadResult"
          exit 1
        }
        Write-Host "Upload completed"

        # Verify blob exists
        $blobExists = az storage blob exists `
          --account-name $env:STORAGE_ACCOUNT `
          --account-key $accountKey `
          --container-name $env:STORAGE_CONTAINER `
          --name $blobName `
          --query "exists" `
          --output tsv

        if ($blobExists -ne "true") {
          Write-Error "Blob verification failed - blob does not exist after upload"
          exit 1
        }
        Write-Host "Blob verified: $blobName exists"

        # Generate SAS URL valid for 30 minutes
        $expiry = (Get-Date).AddMinutes(30).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        $sasUrl = az storage blob generate-sas `
          --account-name $env:STORAGE_ACCOUNT `
          --account-key $accountKey `
          --container-name $env:STORAGE_CONTAINER `
          --name $blobName `
          --permissions r `
          --expiry $expiry `
          --full-uri `
          --output tsv

        if (-not $sasUrl) {
          Write-Error "Failed to generate SAS URL"
          exit 1
        }

        # Base64 encode the URL to safely pass it (SAS URLs contain & which breaks parameter passing)
        $sasUrlBase64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($sasUrl))

        Write-Host "Package uploaded successfully"
        Write-Host "SAS URL generated (expires in 30 minutes)"

        echo "blob-name=$blobName" >> $env:GITHUB_OUTPUT
        echo "sas-url-base64=$sasUrlBase64" >> $env:GITHUB_OUTPUT

    - name: Deploy to VM via Run Command
      id: deploy
      shell: pwsh
      env:
        VM_NAME: ${{ inputs.vm-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        IIS_SITE_NAME: ${{ inputs.iis-site-name }}
        IIS_APP_NAME: ${{ inputs.iis-app-name }}
        IIS_APP_POOL: ${{ inputs.iis-app-pool }}
        PACKAGE_URL_BASE64: ${{ steps.upload-blob.outputs.sas-url-base64 }}
        DEPLOY_SCRIPT_PATH: ${{ inputs.deploy-script-path }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        Write-Host "Deploying to Azure VM via Run Command..."
        Write-Host "VM: $($env:VM_NAME)"
        Write-Host "Resource Group: $($env:RESOURCE_GROUP)"

        # Bake config values into the script header. We embed values directly
        # instead of using --parameters because az vm run-command invoke
        # splits parameter values at spaces (breaks "Default Web Site").
        # Escape single quotes to prevent PowerShell injection in baked values
        $configLines = @(
          "`$PackageUrlBase64 = '$($env:PACKAGE_URL_BASE64 -replace "'", "''")'"
          "`$AppPoolName = '$($env:IIS_APP_POOL -replace "'", "''")'"
          "`$SiteName = '$($env:IIS_SITE_NAME -replace "'", "''")'"
          "`$AppName = '$($env:IIS_APP_NAME -replace "'", "''")'"
          "`$DeployScriptPath = '$($env:DEPLOY_SCRIPT_PATH -replace "'", "''")'"
          "`$Environment = '$($env:DEPLOY_ENVIRONMENT -replace "'", "''")'"
        ) -join "`n"

        # Read the deployment script template and prepend config
        $actionDir = "${{ github.action_path }}"
        $scriptBody = Get-Content -Path (Join-Path $actionDir "vm-deploy.ps1") -Raw
        $vmScript = $configLines + "`n`n" + $scriptBody

        # Write combined script to temp file
        $scriptPath = Join-Path $env:RUNNER_TEMP "deploy-script.ps1"
        $vmScript | Out-File -FilePath $scriptPath -Encoding UTF8

        Write-Host "Executing deployment on VM..."

        # No --parameters: all values are embedded in the script to avoid
        # az vm run-command splitting values at spaces.
        $result = az vm run-command invoke `
          --resource-group $env:RESOURCE_GROUP `
          --name $env:VM_NAME `
          --command-id RunPowerShellScript `
          --scripts "@$scriptPath" `
          --output json 2>&1

        # Filter to string-only output before JSON parsing.
        # 2>&1 produces mixed [string] + [ErrorRecord] objects; ErrorRecord
        # objects break ConvertFrom-Json.
        $jsonText = ($result | Where-Object { $_ -is [string] }) -join "`n"

        Write-Host "VM command completed, parsing result..."

        $resultObj = $null
        try {
            $resultObj = $jsonText | ConvertFrom-Json
        } catch {
            Write-Error "Failed to parse VM run-command result as JSON: $_"
            echo "status=failure" >> $env:GITHUB_OUTPUT
            exit 1
        }

        $stdout = ""
        $stderr = ""
        foreach ($item in $resultObj.value) {
            if ($item.code -like "*StdOut*") { $stdout = $item.message }
            if ($item.code -like "*StdErr*") { $stderr = $item.message }
        }

        Write-Host "`n========== Deployment Output =========="
        Write-Host $stdout
        if ($stderr) {
            Write-Host "`n========== Stderr =========="
            Write-Host $stderr
        }
        Write-Host "======================================`n"

        # Check success marker first. IIS modules may emit warnings to stderr
        # even on successful deployments, so we don't fail on stderr alone.
        $succeeded = $stdout -match "Deployment Completed Successfully"

        if ($succeeded) {
            Write-Host "Deployment successful!"
            if ($stderr -and $stderr.Trim()) {
                Write-Warning "Deployment succeeded but had stderr output (see above)."
            }
            echo "status=success" >> $env:GITHUB_OUTPUT
        } else {
            echo "status=failure" >> $env:GITHUB_OUTPUT
            if ($stderr -and $stderr.Trim()) {
                Write-Error "Deployment failed with errors on the VM. See stderr above."
            } else {
                Write-Error "Deployment failed - success marker not found. Check output above."
            }
            exit 1
        }

    - name: Cleanup blob storage
      if: always() && steps.upload-blob.outputs.blob-name
      shell: pwsh
      env:
        STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        STORAGE_CONTAINER: ${{ inputs.storage-container }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        BLOB_NAME: ${{ steps.upload-blob.outputs.blob-name }}
      run: |
        Write-Host "Cleaning up deployment package from blob storage..."
        $accountKey = az storage account keys list `
          --resource-group $env:RESOURCE_GROUP `
          --account-name $env:STORAGE_ACCOUNT `
          --query "[0].value" `
          --output tsv

        az storage blob delete `
          --account-name $env:STORAGE_ACCOUNT `
          --account-key $accountKey `
          --container-name $env:STORAGE_CONTAINER `
          --name $env:BLOB_NAME `
          --only-show-errors 2>&1 | Out-Null
        Write-Host "Cleanup complete"

    - name: Health check
      if: steps.deploy.outputs.status == 'success'
      shell: pwsh
      env:
        APP_URL: ${{ steps.vm-check.outputs.app-url }}
      run: |
        Write-Host "Performing health check..."
        Write-Host "Application URL: $($env:APP_URL)"

        Start-Sleep -Seconds 10

        try {
          $response = Invoke-WebRequest -Uri $env:APP_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -eq 200) {
            Write-Host "Health check passed! Application is accessible."
          } else {
            Write-Warning "Health check returned status code: $($response.StatusCode)"
          }
        } catch {
          Write-Warning "Health check failed: $_"
          Write-Host "Application may still be starting up."
        }
