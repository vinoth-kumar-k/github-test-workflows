name: 'Publish .NET Application'
description: 'Publishes a .NET application for deployment'
author: 'Architecture Team'

inputs:
  dotnet-version:
    description: '.NET SDK version to use'
    required: false
    default: '9.0.x'
  project-path:
    description: 'Path to project file (relative to repository root)'
    required: true
  configuration:
    description: 'Build configuration (Debug/Release)'
    required: false
    default: 'Release'
  output-path:
    description: 'Output path for published artifacts'
    required: false
    default: './publish'
  use-app-host:
    description: 'Whether to use app host'
    required: false
    default: 'false'
  no-build:
    description: 'Skip building the project (use existing build artifacts)'
    required: false
    default: 'true'

outputs:
  publish-path:
    description: 'Path to published artifacts'
    value: ${{ steps.publish.outputs.publish-path }}

runs:
  using: "composite"
  steps:
    # Note: .NET SDK setup removed - assumed to be done in build step
    # If running standalone, ensure dotnet-build action runs first
    - name: Publish Application
      id: publish
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        CONFIGURATION: ${{ inputs.configuration }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        USE_APP_HOST: ${{ inputs.use-app-host }}
        NO_BUILD: ${{ inputs.no-build }}
      run: |
        # Build the publish command
        PUBLISH_CMD="dotnet publish \"$PROJECT_PATH\" -c \"$CONFIGURATION\" -o \"$OUTPUT_PATH\""

        # Add --no-build flag if requested
        if [ "$NO_BUILD" == "true" ]; then
          PUBLISH_CMD="$PUBLISH_CMD --no-build"
        fi

        PUBLISH_CMD="$PUBLISH_CMD /p:UseAppHost=\"$USE_APP_HOST\""

        # Execute the publish command
        eval $PUBLISH_CMD

        echo "publish-path=$OUTPUT_PATH" >> $GITHUB_OUTPUT
        echo "Published to: $OUTPUT_PATH"
